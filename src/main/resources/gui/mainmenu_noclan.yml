# The title contains these funky characters as the custom resource pack defines them as pngs,
# change this to a normal title if you are not using a custom resource pack.
#   = backspace (move text cursor backwards)
#   = main menu gui png
title: ""

# The layout of the UI
#  a-Z = custom items that you can customise below (cannot be taken)
#  . = empty space that are completely locked, cannot have items dragged in
#  _ = custom area, this is used for things such as the storagemenu, lets the menu decide how to handle this area
layout: |
  . . . . . . . . .
  . . . . . . . . .
  . . . . . . . . .
  . . . . . . . . .
  . . . N T I . . .
  . . . . . . . . .

# Define the items to fill the layout with, the only thing that matters here is the "id", as that controls what
# the button does, so don't change that, everything else is cosmetic and can be customised.
items:
  N:
    id: "new"
    material: YELLOW_CONCRETE
    name: "<bold>Create new clan</bold>"
    lore: "<grey>Create your very own clan.</grey>"
  T:
    id: "leaderboard"
    material: ITEM_FRAME
    name: "<bold>Leaderboard</bold>"
    lore: "<grey>View the top clans on the server.</grey>"
  I:
    id: "invites"
    material: PAPER
    name: "<bold>Invites</bold>"
    lore: "<grey>Check if you have been invited to any clans.</grey>"