# The title contains packman placeholders.
# change this to a normal title if you are not using packman.
title: "[pmshift:-32][pmshift:-16][pmglyph:clans_pack:storage_menu]"

# The layout of the UI
#  a-Z = custom items that you can customise below (cannot be taken)
#  . = empty space that are completely locked, cannot have items dragged in
#  _ = custom area, this is used for things such as the storagemenu, lets the menu decide how to handle this area
layout: |
  _ _ _ _ _ _ _ _ _
  _ _ _ _ _ _ _ _ _
  _ _ _ _ _ _ _ _ _
  _ _ _ _ _ _ _ _ _
  _ _ _ _ _ _ _ _ _
  B . . . . . . R C

# Define the items to fill the layout with, the only thing that matters here is the "id", as that controls what
# the button does, so don't change that, everything else is cosmetic and can be customised.
items:
  B:
    id: "back"
    material: BARRIER
    name: "<bold>Back</bold>"
    lore: "<grey>Go back to view all storages.</grey>"
  R:
    id: "rename"
    material: NAME_TAG
    name: "<bold>Rename</bold>"
    lore: "<grey>Rename this storage.</grey>"
  C:
    id: "color"
    material: WHITE_WOOL
    name: "<bold>Change Color</bold>"
    lore: "<grey>Change the color of this storage.</grey>"