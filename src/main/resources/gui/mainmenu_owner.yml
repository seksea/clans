# The title contains packman placeholders.
# change this to a normal title if you are not using packman.
title: "[pmshift:-32][pmshift:-16][pmglyph:clans_pack:main_menu]"

# The layout of the UI
#  a-Z = custom items that you can customise below (cannot be taken)
#  . = empty space that are completely locked, cannot have items dragged in
#  _ = custom area, this is used for things such as the storagemenu, lets the menu decide how to handle this area
layout: |
  . . . . . . . . .
  . . . . . . . . .
  . . . . . . . . .
  . . . . . . . . .
  . F S W T I M L .
  . . . . C . . . .

# Define the items to fill the layout with, the only thing that matters here is the "id", as that controls what
# the button does, so don't change that, everything else is cosmetic and can be customised.
items:
  F:
    id: "furnace"
    material: FURNACE
    name: "<bold>Furnace</bold>"
    lore: "<grey>Burn items to rank up your clan.</grey>"
  S:
    id: "storage"
    material: CHEST
    name: "<bold>Storage</bold>"
    lore: "<grey>Access the shared storage.</grey>"
  I:
    id: "invite"
    material: ARROW
    name: "<bold>Invite</bold>"
    lore: "<grey>Invite a new player to the clan.</grey>"
  T:
    id: "leaderboard"
    material: ITEM_FRAME
    name: "<bold>Leaderboard</bold>"
    lore: "<grey>View the top clans on the server.</grey>"
  W:
    id: "warps"
    material: COMPASS
    name: "<bold>Warps</bold>"
    lore: "<grey>Teleport to one of the clan warps.</grey>"
  M:
    id: "manage"
    material: WRITABLE_BOOK
    name: "<red>Manage</red>"
    lore: "<grey>Change settings for the clan.</grey>"
  L:
    id: "delete"
    material: BARRIER
    name: "<red><bold>Delete</bold></red>"
    lore: "<grey>Delete this clan.</grey>"
  C:
    id: "claninfo"
    material: PAPER
    name: "<bold>Info</bold>"
    lore: "<grey>blah blah blah</grey>" # lore is set by MainMenu (see messages.yml main-menu.clan-info to change msg)