commands:
  delete:
    not-in-clan: "You need to be in a clan to delete a clan."
    not-owner-of-clan: "You cannot delete a clan if you are not the owner."
    deleted-clan: "Successfully deleted clan <b>%clan_name%</b>."
  info:
    info-message: |
        <green> ==================================</green>
        Info for clan <b>%clan_name%</b>:
        <grey>-----------------------------------------</grey>
        Description: <grey>%clan_description%</grey>
        Owner: <b>%clan_owner_name%</b>
        <hover:show_text:"<green>%clan_name% members:</green><br>%clan_members_list%"><yellow><u>[members (%clan_num_members%)]</u></yellow></hover>
        <green>=========================================</green>
    not-exist: "Clan <b>%clan_name%</b> does not exist."
  leave:
    not-in-clan: "You need to be in a clan to leave a clan."
    owner-of-clan: "You cannot leave a clan if you are the owner, please delete the clan with <b>/clan delete</b>."
    left-clan: "You have left the clan <b>%clan_name%</b>"
  manage:
    update-var: "Updating <b>%var_name%</b> of clan <b>%clan_name%</b> to: <grey>%new_value%</grey>"
    get-var: "<b>%var_name%</b> of clan <b>%clan_name%</b> is: <grey>%value%</grey>"
  new:
    already-in-clan: "Can't create clan as you are already in another clan, use <b>/clan leave</b> first."
    created-new-clan: "Created new clan <b>%clan_name%</b>."